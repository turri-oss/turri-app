# The app as people install it: turri.app in a .dmg and a .zip on macOS, an AppImage and a .deb on Linux - `npm run dist`,
# into release/. Not signed with a Developer ID yet: on macOS it is signed ad hoc, so Gatekeeper asks before it opens,
# and it cannot update itself. The .zip and the latest*.yml beside each build are what an update is read from.
appId: dev.turri.app
productName: turri
copyright: Copyright © turri-oss
artifactName: turri-${version}-${os}-${arch}.${ext}

# Where releases are published - by CI, from a tag (.github/workflows/release.yml) - and where the app looks for its
# updates (electron/updates.ts). A release is a draft until published by hand: only then do apps update to it.
publish:
  provider: github
  owner: turri-oss
  repo: turri-desktop
  releaseType: draft

directories:
  output: release
  buildResources: build

# What the app is: the window (dist), the main process and preload (dist-electron), the engine, and the icon the window
# and the Dock are given. node_modules is the dependencies only - the window is bundled by Vite - copied as npm
# installed them by scripts/after-pack.cjs, as electron-builder's own collector leaves some out.
files:
  - package.json
  - dist/**
  - dist-electron/**
  - engine/**
  - build/icon.png
  - "!node_modules/**"
afterPack: scripts/after-pack.cjs

# No archive: the engine is a Node process of its own, forked from engine/engine.mjs, turri and pi read and start files
# of their own beside their code, and node-pty starts its shell helper by path - all of it real files, in
# Resources/app.
asar: false

# node-pty ships built for macOS and is built for Linux by npm install, against Node-API: it runs on Electron as it is,
# so nothing is rebuilt.
npmRebuild: false

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad hoc, until there is a Developer ID: Apple silicon runs nothing unsigned.
  identity: "-"
  hardenedRuntime: false
  # A folder dropped on the Dock icon or opened with turri from Finder is a project (app.on("open-file")).
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.folder]

dmg:
  title: turri

linux:
  target: [AppImage, deb]
  category: Development
  icon: build/icon.png
  synopsis: turri, for people who do not live in a terminal
  maintainer: turri-oss <https://github.com/turri-oss/turri-desktop>

